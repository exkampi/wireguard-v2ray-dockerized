services:
  xray:
    image: teddysun/xray:latest
    container_name: xray
    restart: unless-stopped
    working_dir: /app
    ports:
      - "443:1443/tcp"
      - "443:1443/udp"
    volumes:
      - ./xray:/app/tmp
    entrypoint: |
      sh -c "
        apk add --no-cache curl openssl util-linux jq && 
        cp /app/tmp/xconfig.json /app/xconfig.json &&
        cp /app/tmp/init-xray-server.sh /app/init-xray-server.sh &&
        chmod +x /app/init-xray-server.sh &&
        /app/init-xray-server.sh &&
        xray run -c /app/xconfig.json
      "
    networks:
      - proxy-net
    depends_on:
      - wg

  wg:
    image: linuxserver/wireguard:latest
    container_name: wg
    working_dir: /config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Stockholm
      - SERVERURL=auto
      - SERVERPORT=51820
      - PEERS=1
      - PEERDNS=1.1.1.1,1.0.0.1
      - ALLOWEDIPS=0.0.0.0/0
      - INTERNAL_SUBNET=10.13.13.0
      - PERSISTENTKEEPALIVE_PEERS=25
    volumes:
      - /lib/modules:/lib/modules
    ports:
      - 51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      - proxy-net

networks:
  proxy-net:
    driver: bridge
