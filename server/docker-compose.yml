services:
  wg:
    image: linuxserver/wireguard:latest
    container_name: wg
    restart: unless-stopped
    working_dir: /config
    environment:
      - LOG_CONFS=false
      - PUID=1000
      - PGID=1000
      - SERVERURL=auto
      - INTERNAL_SUBNET=10.13.13.0
      - SERVERPORT=51820
      - PEERS=1
      - PEERDNS=1.1.1.1,1.0.0.1
      - ALLOWEDIPS=0.0.0.0/0
      - PERSISTENTKEEPALIVE_PEERS=25
    cap_add:
      - SYS_MODULE
      - NET_ADMIN
    expose:
      - 51820/udp
    volumes:
      - ./wg:/app/tmp
      - ./wg/copy-files.sh:/custom-cont-init.d/copy-files.sh
      - /lib/modules:/lib/modules
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      v2:
        ipv4_address: 10.13.13.2

  v2ray:
    image: v2fly/v2fly-core:latest
    container_name: v2ray
    restart: unless-stopped
    working_dir: /app
    expose:
      - 51820/udp
    ports:
      - 60123:1433/tcp
      - 60123:1433/udp
    volumes:
      - ./v2ray:/app/tmp
    entrypoint: |
      sh -c "
        cp /app/tmp/v2config.json /app/v2config.json &&
        cp /app/tmp/init-v2ray-server.sh /app/init-v2ray-server.sh &&
        chmod +x /app/init-v2ray-server.sh &&
        /app/init-v2ray-server.sh
        v2ray run -c /app/v2config.json
      "
    networks:
      v2:
        ipv4_address: 10.13.13.3

networks:
  v2:
    name: v2
    external: true