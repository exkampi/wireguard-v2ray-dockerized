services:
  wg:
    image: linuxserver/wireguard:latest
    container_name: wg
    restart: unless-stopped
    working_dir: /config
    environment:
      - LOG_CONFS=false
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Samara
      - SERVERURL=auto
      - INTERNAL_SUBNET=10.13.13.0
      - SERVERPORT=51820
      - ALLOWEDIPS=10.13.13.4/32
      - PEERS=1
      - PEERDNS=1.1.1.1,1.0.0.1
    cap_add:
      - SYS_MODULE
      - NET_ADMIN
    expose:
      - 51820/udp
    volumes:
      - ./wg/template-server.conf:/config/templates/server.conf
      - ./wg/template-peer.conf:/config/templates/peer.conf
      - ./wg/wg0.conf:/config/wg_confs/wg0.conf
      - /lib/modules:/lib/modules
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      v2:
        ipv4_address: 10.13.13.2

  v2ray:
    image: v2fly/v2fly-core:latest
    container_name: v2ray
    restart: unless-stopped
    expose:
      - 51820/udp
    ports:
      - 60123:1433/tcp
      - 60123:1433/udp
    volumes:
      - ./v2ray:/app/v2ray
      - ./init-scripts:/app/init-scripts
    entrypoint: |
      sh -c "
        chmod +x /app/init-scripts/init-v2ray-server.sh &&
        /app/init-scripts/init-v2ray-server.sh
        v2ray run -c /app/v2ray/v2config.json
      "
    networks:
      v2:
        ipv4_address: 10.13.13.3

networks:
  v2:
    name: v2
    external: true