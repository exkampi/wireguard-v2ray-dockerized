services:
  v2ray:
    image: v2fly/v2fly-core:latest
    container_name: v2ray
    restart: unless-stopped
    environment:
      - UUID=${UUID}
      - SERVER_IP=${SERVER_IP}
    ports:
      - 51820:51820
      - 51820:51820/udp
    volumes:
      - ./v2config.json:/etc/v2ray/config.json
      - ./init-v2ray-client.sh:/init-v2ray-client.sh
    entrypoint: ["/bin/sh", "/init-v2ray-client.sh"]
